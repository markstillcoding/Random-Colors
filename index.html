<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
  <title>Colors</title>
</head>

<body>
  <div class="app">
    <section class="color-creation">
      <h1 class="app__title">Color Finder</h1>
      <div class="app__color-box"></div><button class="app__btn">Change Color</button>
    </section>
    <section class="color-choices">
      <h3>Red</h3>
      <input type="range" name="red" id="red" min="0" max="255" step="51" value="0" />
      <div>Value: <span id="value"></span></div>
      <h3>Green</h3>
      <h3>Blue</h3>
    </section>
  </div>

</body>





</html>

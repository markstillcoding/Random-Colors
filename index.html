<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
  <title>Colors</title>
</head>

<body>
  <div class="app">
    <section class="color-creation">
      <h1 class="app__title">Color Finder</h1>
      <div class="app__color-box"></div><button class="app__btn">Change Color</button>
    </section>
    <section class="color-choices">
      <h3>Red</h3>
      <div>
        <div>
          <input type="radio" name="red" id="red" value="0-51">
          <label for="red">0 - 51</label>
        </div>
        <div>
          <input type="radio" name="red" id="red" value="52-102">
          <label for="red">52 - 102</label>
        </div>
        <div>
          <input type="radio" name="red" id="red" checked value="103-153">
          <label for="red">103 - 153</label>
        </div>
        <div>
          <input type="radio" name="red" id="red" value="154-205">
          <label for="red">154 - 205</label>
        </div>
        <div>
          <input type="radio" name="red" id="red" value="206-255">
          <label for="red">206 - 255</label>
        </div>
      </div>
      <h3>Green</h3>
      <div>
        <div>
          <input type="radio" name="green" id="green" value="0-51">
          <label for="green">0 - 51</label>
        </div>
        <div>
          <input type="radio" name="green" id="green" value="52-102">
          <label for="green">52 - 102</label>
        </div>
        <div>
          <input type="radio" name="green" id="green" value="103-153">
          <label for="green">103 - 153</label>
        </div>
        <div>
          <input type="radio" name="green" id="green" value="154-205">
          <label for="green">154 - 205</label>
        </div>
        <div>
          <input type="radio" name="green" id="green" checked value="206-255">
          <label for="green">206 - 255</label>
        </div>
      </div>
      <h3>Blue</h3>
      <div>
        <div>
          <input type="radio" name="blue" id="blue" value="0-51">
          <label for="blue">0 - 51</label>
        </div>
        <div>
          <input type="radio" name="blue" id="blue" checked value="52-102">
          <label for="blue">52 - 102</label>
        </div>
        <div>
          <input type="radio" name="blue" id="blue" value="103-153">
          <label for="blue">103 - 153</label>
        </div>
        <div>
          <input type="radio" name="blue" id="blue" value="154-205">
          <label for="blue">154 - 205</label>
        </div>
        <div>
          <input type="radio" name="blue" id="blue" value="206-255">
          <label for="blue">206 - 255</label>
        </div>
      </div>
    </section>
  </div>

</body>





</html>

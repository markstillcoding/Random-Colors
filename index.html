<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
  <title>Colors</title>
</head>

<body>
  <div class="app">
    <section class="color-creation">
      <h1 class="app__title">Color Finder</h1><button class="app__btn">Create Color</button>
    </section>
    <section class="color-choices">
      <div class="events-container">
        <div><input type="range" name="red" id="red" min="0" max="255" value="0" /><label for="red"></label></div>
        <div><input type="range" name="green" id="green" min="0" max="255" value="0" /><label for="green"></label>
        </div>
        <div><input type="range" name="blue" id="blue" min="0" max="255" value="0" /><label for="blue"></label></div>
      </div><button class="custom-color">Create Custom Colors</button>
    </section>
    <section class="color-grid"></section>
  </div>
  <dialog id="dialog">
    <div class="original-color-box"></div><button type="button" id="close">Close Dialog</button>
  </dialog>
</body>

</html>
